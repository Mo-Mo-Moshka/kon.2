; Конфигурация инструмента визуализации графа зависимостей Maven.

[package]
; Имя анализируемого пакета: groupId:artifactId
; (в тестовом режиме — большие латинские буквы, например A)
name = org.apache.commons:commons-lang3
; Версия пакета
version = 3.14.0

[repository]
; URL-адрес репозитория Maven
url = https://repo1.maven.org/maven2
; Режим работы с тестовым репозиторием: on / off
test_mode = off
; Путь к файлу описания тестового репозитория (нужен при test_mode = on)
test_file = examples/test_repo.txt

[output]
; Имя сгенерированного файла с изображением графа
image = graph.png
; Режим вывода зависимостей в формате ASCII-дерева: on / off
ascii_tree = on
